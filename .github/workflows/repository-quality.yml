name: Repository quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checkout-integrity:
    name: Checkout integrity (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}

      - name: Compile repository Python
        run: python -m compileall -q scripts src tests

      - name: Verify cross-platform checkout and current-state pointer
        run: python -m unittest tests.test_repository_checkout_quality_v1

      - name: Run repository-only safety tests without site packages
        run: >-
          python -S -m unittest
          tests.test_python_dependency_contract_v1
          tests.test_execute_sec_edgar_iapd_wayback_availability_v1
          tests.test_sec_edgar_iapd_wayback_capture_plan_v4
          tests.test_sec_edgar_iapd_wayback_capture_release_v4
          tests.test_external_text_normalization
          tests.test_crimson_url_features
