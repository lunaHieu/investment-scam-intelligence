name: Repository quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checkout-integrity:
    name: Checkout integrity (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}

      - name: Compile repository Python
        run: python -m compileall -q scripts src tests

      - name: Verify cross-platform checkout and current-state pointer
        run: python -m unittest tests.test_repository_checkout_quality_v1

      - name: Verify dependency declarations without site packages
        run: python -S -m unittest tests.test_python_dependency_contract_v1

      - name: Run repository-only normalization and network-guard tests
        run: >-
          python -S -m unittest
          tests.test_execute_sec_edgar_iapd_wayback_availability_v1
          tests.test_external_text_normalization
          tests.test_crimson_url_features

      - name: Verify V7 capture-plan complete-population invariant
        if: always()
        shell: pwsh
        run: |
          $output = python -S -m unittest tests.test_repository_capture_plan_portability_v1 2>&1 | Out-String
          Write-Output $output
          if ($LASTEXITCODE -ne 0) {
            $details = $output.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Capture-plan happy-path test failed::$details"
            exit 1
          }

      - name: Verify V7 capture-plan unresolved-row fail-closed invariant
        if: always()
        run: >-
          python -S -m unittest
          tests.test_sec_edgar_iapd_wayback_capture_plan_v4.SecEdgarIapdWaybackCapturePlanV4Tests.test_partial_v7_fails_closed_even_if_claimed_complete

      - name: Verify V7 capture-plan cross-generation fail-closed invariant
        if: always()
        run: >-
          python -S -m unittest
          tests.test_sec_edgar_iapd_wayback_capture_plan_v4.SecEdgarIapdWaybackCapturePlanV4Tests.test_nonpassing_or_cross_generation_qa_fails_closed

      - name: Run repository-only V7 capture-release tests
        if: always()
        run: python -S -m unittest tests.test_sec_edgar_iapd_wayback_capture_release_v4
